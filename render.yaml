services:
  - type: web
    name: eskom-connect-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CUSTOMER_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: NODE_ENV
        value: production
